<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>大船靠岸</title>
    <!-- Google Font & Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050b14;
            color: #eef2ff;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* 复古极客工业风格 */
        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #111722;
            --border-glow: #2a3a55;
            --accent-cyan: #2dd4bf;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --text-dim: #9ca3af;
            --text-bright: #f0f3fa;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1722;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3e5f;
            border-radius: 8px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* 导航栏 - 硬核暗黑 */
        .navbar {
            background: rgba(8, 12, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e2a3e;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2dd4bf, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .badge-geek {
            background: #1e2a3a;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #a5f3fc;
            border: 0.5px solid #2dd4bf40;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #2dd4bf;
        }
        .member-badge {
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            border: 1px solid #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .member-badge i {
            color: #2dd4bf;
            margin-right: 6px;
        }

        /* Hero 区 */
        .hero-forum {
            margin: 32px 0 48px;
            text-align: center;
        }
        .hero-forum h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffffff, #7aa2f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .hero-forum p {
            color: #9ca8bf;
            max-width: 650px;
            margin: 16px auto 0;
            font-size: 1.05rem;
        }
        .wave {
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        /* 快速发帖区域 */
        .quick-post {
            background: #111722;
            border-radius: 28px;
            border: 1px solid #253244;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 12px 24px -12px rgba(0,0,0,0.6);
        }
        .quick-post h3 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .quick-post input, .quick-post select, .quick-post textarea {
            background: #0c111c;
            border: 1px solid #2a3a4e;
            border-radius: 20px;
            padding: 12px 18px;
            color: #eef2ff;
            font-family: inherit;
            width: 100%;
            margin-bottom: 14px;
            outline: none;
            transition: 0.2s;
        }
        .quick-post input:focus, .quick-post select:focus, .quick-post textarea:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 0 2px #2dd4bf20;
        }
        .post-btn {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: #b9e2ff;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .post-btn:hover {
            background: #2dd4bf;
            border-color: #2dd4bf;
            color: #0a0f1a;
        }

        /* 论坛过滤栏 */
        .forum-toolbar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin: 32px 0 24px;
            align-items: center;
        }
        .tag-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: #111722;
            border: 1px solid #2d3e5a;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-chip.active, .filter-chip:hover {
            background: #2dd4bf;
            color: #0f172a;
            border-color: #2dd4bf;
            font-weight: 600;
        }
        .sort-select {
            background: #111722;
            border: 1px solid #2d3e5a;
            border-radius: 40px;
            padding: 6px 16px;
            color: #eef2ff;
        }

        /* 帖子网格 */
        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 60px;
        }
        .post-card {
            background: #111722;
            border-radius: 24px;
            border-left: 4px solid #2dd4bf;
            padding: 20px 24px;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .post-card:hover {
            transform: translateX(4px);
            background: #151e2c;
            border-left-color: #a855f7;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #f0f3ff;
        }
        .post-tag {
            background: #0f212e;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #7dd3fc;
        }
        .post-meta {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: #7f8ea3;
            margin: 12px 0 10px;
        }
        .post-excerpt {
            color: #b9c7db;
            line-height: 1.5;
            margin: 8px 0 10px;
        }
        .post-stats {
            display: flex;
            gap: 24px;
            font-size: 0.75rem;
            color: #5f6f8a;
        }
        .post-stats i {
            margin-right: 4px;
        }

        /* 会员注册模态框 */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #0f1622;
            border-radius: 32px;
            max-width: 440px;
            width: 90%;
            padding: 32px 28px;
            border: 1px solid #2dd4bf40;
            position: relative;
        }
        .modal-card h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .modal-card input {
            width: 100%;
            background: #1a2332;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 40px;
            margin: 12px 0;
            color: white;
        }
        .close-modal {
            position: absolute;
            right: 24px;
            top: 24px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #9aaec0;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2dd4bf;
            color: #0a0f1a;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: bold;
            z-index: 1100;
            font-size: 0.9rem;
            box-shadow: 0 0 8px #2dd4bf;
        }

        /* 帖子详情模态框 */
        .detail-modal .modal-card {
            max-width: 680px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .reply-area {
            margin-top: 20px;
            border-top: 1px solid #253244;
            padding-top: 18px;
        }
        .reply-input {
            width: 100%;
            background: #0c111c;
            border-radius: 24px;
            padding: 12px;
            border: 1px solid #334155;
            color: white;
            margin: 10px 0;
        }
        .comment-item {
            background: #0a0f1a;
            border-radius: 20px;
            padding: 10px 14px;
            margin: 12px 0;
        }

        footer {
            text-align: center;
            padding: 32px;
            border-top: 1px solid #1e2a3e;
            margin-top: 20px;
            color: #5f7595;
            font-size: 0.8rem;
        }

        button, .filter-chip, .post-card {
            cursor: pointer;
        }
        @media (max-width: 680px) {
            .container { padding: 0 16px; }
            .post-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="container nav-inner">
        <div class="logo-area">
            <div class="logo">⚓ 大船靠岸</div>
            <div class="badge-geek"><i class="fas fa-microchip"></i> 极客·拾荒者</div>
        </div>
        <div class="nav-links">
            <a href="#" class="active">🏠 码头</a>
            <a href="#" id="openMemberModalBtn"><i class="fas fa-user-astronaut"></i> 登船</a>
            <div class="member-badge" id="memberInfoBadge"><i class="fas fa-skull-crossbones"></i> 游客极客</div>
        </div>
    </div>
</div>

<div class="container">
    <div class="hero-forum">
        <h1>⚡ 大船靠岸 <span class="wave">🛸</span></h1>
        <p>极客族聚集地｜垃圾佬的浪漫｜分享捡垃圾、魔改、怀旧数码、掌机、ccd、电脑，让电子废土绽放光芒。</p>
    </div>

    <!-- 快速发帖区 -->
    <div class="quick-post">
        <h3><i class="fas fa-ship"></i> 发布新帖 · 靠岸分享</h3>
        <input type="text" id="postTitle" placeholder="标题：例如‘30元淘到的索尼随身听修复记’" maxlength="80">
        <select id="postCategory">
            <option value="赏玩心得">📖 赏玩心得</option>
            <option value="捡漏报告">🔍 捡漏报告</option>
            <option value="维修改装">🔧 维修改装</option>
            <option value="问题求助">💬 问题求助</option>
            <option value="作品展示">📸 作品展示</option>
        </select>
        <textarea id="postContent" rows="2" placeholder="分享你的数码故事、技术干货、或是在垃圾堆里发现的惊喜..."></textarea>
        <button class="post-btn" id="publishPostBtn"><i class="fas fa-anchor"></i> 抛锚发帖</button>
    </div>

    <!-- 论坛工具栏 -->
    <div class="forum-toolbar">
        <div class="tag-filters" id="tagFilterGroup">
            <div class="filter-chip active" data-filter="all">🌊 全部浪潮</div>
            <div class="filter-chip" data-filter="赏玩心得">📖 赏玩心得</div>
            <div class="filter-chip" data-filter="捡漏报告">🔍 捡漏报告</div>
            <div class="filter-chip" data-filter="维修改装">🔧 维修改装</div>
            <div class="filter-chip" data-filter="问题求助">💬 求助码头</div>
            <div class="filter-chip" data-filter="作品展示">📸 作品展示</div>
        </div>
        <select id="sortSelect" class="sort-select">
            <option value="timeDesc">⏱️ 最新发布</option>
            <option value="hotDesc">🔥 最热评论</option>
        </select>
    </div>

    <!-- 帖子列表容器 -->
    <div id="postsList" class="posts-grid">
        <!-- 动态渲染帖子 -->
        <div style="text-align:center; padding:40px;">加载中...</div>
    </div>
</div>

<footer>
    <p>「大船靠岸」极客论坛 | 二手数码文化 | 自由分享 善意交流 | 浪潮之上 皆为同好</p>
</footer>

<!-- 注册/登录模态框 -->
<div id="memberModal" class="modal">
    <div class="modal-card">
        <i class="fas fa-times close-modal" id="closeMemberModal"></i>
        <h3><i class="fas fa-space-shuttle"></i> 成为船员</h3>
        <p style="margin-bottom: 16px;">起个酷炫的极客ID，开启数码漫游</p>
        <input type="text" id="memberName" placeholder="船员代号 (例如: 回收站术士、CRT神教)" autocomplete="off">
        <input type="password" id="memberPwd" placeholder="密码 (任意, 本地模拟)">
        <button id="registerBtn" style="background:#2dd4bf; color:#0a0f1a; width:100%; margin-top:16px; padding:12px; border:none; border-radius:40px; font-weight:bold;"><i class="fas fa-key"></i> 登船/注册</button>
        <div style="margin-top: 18px; font-size:0.7rem; color:#5f7f9e;">* 仅作论坛体验，数据存储于浏览器</div>
    </div>
</div>

<!-- 帖子详情模态框 -->
<div id="postDetailModal" class="modal detail-modal">
    <div class="modal-card">
        <i class="fas fa-times close-modal" id="closePostModal"></i>
        <div id="postDetailContent"></div>
    </div>
</div>

<script>
    // ---------- 论坛数据 ----------
    // 帖子结构: { id, title, content, category, author, timestamp, comments: [{author, text, timestamp}], likes }
    let posts = [];
    let currentUser = null;   // { name }
    let currentFilter = "all";
    let currentSort = "timeDesc";

    // helper: 保存/加载本地存储
    function savePosts() {
        localStorage.setItem("dachuan_posts", JSON.stringify(posts));
    }
    function loadPosts() {
        const stored = localStorage.getItem("dachuan_posts");
        if(stored) {
            try{
                posts = JSON.parse(stored);
                if(!Array.isArray(posts)) posts = [];
            }catch(e){ posts = []; }
        }
        if(!posts.length) {
            // 初始极客风格种子数据
            posts = [
                { id: Date.now()+1, title: "CCD老数码相机真香！百元直出复古感", content: "最近淘了一台索尼w220，ccd成像色彩太毒了，胶片感十足，分享直出样片。", category: "赏玩心得", author: "胶片巫师", timestamp: Date.now() - 86400000, comments: [{ author: "底片狂魔", text: "w系列确实不错，ccd就是低像素魔力", timestamp: Date.now()-70000000 }], likes: 12 },
                { id: Date.now()+2, title: "捡漏报告：50元收到IBM Model M屈蹲弹簧键盘", content: "垃圾站捡到一把1993年model m，清洗后手感爆棚，敲字像开机关枪。", category: "捡漏报告", author: "机械老妖", timestamp: Date.now() - 172800000, comments: [{ author: "青轴信徒", text: "屈蹲弹簧yyds!", timestamp: Date.now()-150000000 }], likes: 34 },
                { id: Date.now()+3, title: "改造ThinkPad X230 13.3寸高分屏教程", content: "换屏+刷EC+改键盘，老本重获新生，跑arch Linux美滋滋。", category: "维修改装", author: "电工小张", timestamp: Date.now() - 43200000, comments: [], likes: 27 },
                { id: Date.now()+4, title: "有没有老歌推荐搭配walkman随身听？", content: "刚修复一台索尼ex610，听磁带简直时光倒流，求推荐适合的摇滚/港台老歌。", category: "问题求助", author: "卡座少年", timestamp: Date.now() - 7200000, comments: [{ author: "骚尼粉", text: "Beyond，皇后大道东，磁带味道绝了", timestamp: Date.now()-3600000 }], likes: 8 }
            ];
            savePosts();
        }
        renderPosts();
    }

    function saveUser() {
        if(currentUser) localStorage.setItem("dachuan_user", JSON.stringify(currentUser));
        else localStorage.removeItem("dachuan_user");
        updateMemberUI();
    }
    function loadUser() {
        const u = localStorage.getItem("dachuan_user");
        if(u) {
            try{ currentUser = JSON.parse(u); } catch(e){ currentUser = null; }
        } else currentUser = null;
        updateMemberUI();
    }

    function updateMemberUI() {
        const badge = document.getElementById("memberInfoBadge");
        if(currentUser) {
            badge.innerHTML = `<i class="fas fa-user-ninja"></i> ${escapeHtml(currentUser.name)}`;
        } else {
            badge.innerHTML = `<i class="fas fa-skull-crossbones"></i> 游客极客`;
        }
    }

    function isLoggedIn() { return currentUser !== null; }

    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = msg;
        if(isError) toast.style.background = "#f97316";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2200);
    }

    // 发布新帖
    function publishPost(title, category, content) {
        if(!title.trim() || !content.trim()) {
            showToast("标题和内容不能为空～", true);
            return false;
        }
        if(!isLoggedIn()) {
            showToast("请先‘登船’成为船员再发帖", true);
            return false;
        }
        const newPost = {
            id: Date.now(),
            title: title.trim(),
            content: content.trim(),
            category: category,
            author: currentUser.name,
            timestamp: Date.now(),
            comments: [],
            likes: Math.floor(Math.random() * 15)
        };
        posts.unshift(newPost);
        savePosts();
        renderPosts();
        showToast(`⚓ 新帖“${escapeHtml(title)}”已靠岸！`);
        return true;
    }

    // 增加评论
    function addComment(postId, commentText) {
        if(!commentText.trim()) return false;
        if(!isLoggedIn()) { showToast("请先登船再评论～"); return false; }
        const post = posts.find(p => p.id == postId);
        if(post) {
            post.comments.push({
                author: currentUser.name,
                text: commentText.trim(),
                timestamp: Date.now()
            });
            savePosts();
            renderPosts();  // 刷新列表保持同步, 详情弹窗也会重新渲染
            if(document.getElementById("postDetailModal").classList.contains("open")){
                // 如果详情打开，重绘详情内容
                const currentOpenId = postId;
                showPostDetail(currentOpenId);
            }
            showToast("评论投放成功！");
            return true;
        }
        return false;
    }

    // 排序与过滤
    function filterAndSortPosts() {
        let filtered = [...posts];
        if(currentFilter !== 'all') {
            filtered = filtered.filter(p => p.category === currentFilter);
        }
        if(currentSort === 'timeDesc') {
            filtered.sort((a,b) => b.timestamp - a.timestamp);
        } else if(currentSort === 'hotDesc') {
            filtered.sort((a,b) => (b.comments.length + b.likes) - (a.comments.length + a.likes));
        }
        return filtered;
    }

    function renderPosts() {
        const container = document.getElementById("postsList");
        const filtered = filterAndSortPosts();
        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:48px;">🐚 还没有帖子，快抛锚发一篇数码宝藏～</div>`;
            return;
        }
        container.innerHTML = filtered.map(post => `
            <div class="post-card" data-post-id="${post.id}">
                <div class="post-header">
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-tag">${escapeHtml(post.category)}</div>
                </div>
                <div class="post-meta">
                    <span><i class="fas fa-user-astronaut"></i> ${escapeHtml(post.author)}</span>
                    <span><i class="far fa-calendar-alt"></i> ${formatTime(post.timestamp)}</span>
                </div>
                <div class="post-excerpt">
                    ${escapeHtml(post.content.length > 110 ? post.content.substring(0,110)+"..." : post.content)}
                </div>
                <div class="post-stats">
                    <span><i class="fas fa-comment"></i> ${post.comments.length} 回复</span>
                    <span><i class="fas fa-heart"></i> ${post.likes || 0} 热度</span>
                    <span><i class="fas fa-eye"></i> 查看详情</span>
                </div>
            </div>
        `).join('');
        // 绑定卡片点击事件
        document.querySelectorAll('.post-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const id = parseInt(card.getAttribute('data-post-id'));
                showPostDetail(id);
            });
        });
    }

    function showPostDetail(postId) {
        const post = posts.find(p => p.id === postId);
        if(!post) return;
        const modal = document.getElementById("postDetailModal");
        const contentDiv = document.getElementById("postDetailContent");
        const commentListHtml = post.comments.map(c => `
            <div class="comment-item">
                <strong><i class="fas fa-feather-alt"></i> ${escapeHtml(c.author)}</strong> <span style="font-size:0.7rem; color:#6b85a3;">${formatTime(c.timestamp)}</span>
                <div style="margin-top:6px;">${escapeHtml(c.text)}</div>
            </div>
        `).join('');
        contentDiv.innerHTML = `
            <h2 style="margin-bottom: 8px;">${escapeHtml(post.title)}</h2>
            <div class="post-tag" style="display:inline-block; margin-bottom:12px;">${escapeHtml(post.category)}</div>
            <div class="post-meta" style="margin-bottom: 12px;">
                <span><i class="fas fa-user"></i> ${escapeHtml(post.author)}</span>
                <span><i class="fas fa-clock"></i> ${formatTime(post.timestamp)}</span>
                <span><i class="fas fa-fire"></i> 热度 ${post.likes || 0}</span>
            </div>
            <div style="background:#0a0f1a; padding: 16px; border-radius: 20px; margin: 16px 0;">
                ${escapeHtml(post.content).replace(/\n/g,'<br>')}
            </div>
            <div><strong><i class="fas fa-comments"></i> 船友回声 (${post.comments.length})</strong></div>
            <div id="commentListArea">${commentListHtml || '<div style="color:#6f8aae;">暂无评论，做第一个靠岸回声的人～</div>'}</div>
            <div class="reply-area">
                <textarea id="replyText" rows="2" class="reply-input" placeholder="写下你的极客见解..."></textarea>
                <button id="submitCommentBtn" class="post-btn" style="background:#2d3e5a;">⛵ 发送回声</button>
            </div>
        `;
        modal.classList.add("open");
        const submitBtn = document.getElementById("submitCommentBtn");
        const newReplyBtn = () => {
            const textarea = document.getElementById("replyText");
            if(textarea && textarea.value.trim()) {
                addComment(post.id, textarea.value);
                textarea.value = "";
                // 刷新详情内容
                showPostDetail(post.id);
            } else {
                showToast("写点内容再召唤回声吧", true);
            }
        };
        if(submitBtn) {
            submitBtn.onclick = newReplyBtn;
        }
    }

    // 辅助函数
    function formatTime(ts) {
        const date = new Date(ts);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        if(diff < 60) return "刚刚";
        if(diff < 3600) return `${Math.floor(diff/60)}分钟前`;
        if(diff < 86400) return `${Math.floor(diff/3600)}小时前`;
        return `${date.getMonth()+1}/${date.getDate()}`;
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // 事件绑定
    function init() {
        loadUser();
        loadPosts();
        // 筛选
        const chips = document.querySelectorAll('.filter-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.getAttribute('data-filter');
                renderPosts();
            });
        });
        const sortSelect = document.getElementById("sortSelect");
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderPosts();
        });
        // 发布帖子
        const publishBtn = document.getElementById("publishPostBtn");
        publishBtn.addEventListener('click', () => {
            const title = document.getElementById("postTitle").value;
            const category = document.getElementById("postCategory").value;
            const content = document.getElementById("postContent").value;
            if(publishPost(title, category, content)) {
                document.getElementById("postTitle").value = '';
                document.getElementById("postContent").value = '';
            }
        });
        // 会员模态框
        const memberModal = document.getElementById("memberModal");
        const openBtn = document.getElementById("openMemberModalBtn");
        const closeMember = document.getElementById("closeMemberModal");
        openBtn.addEventListener('click', () => memberModal.classList.add("open"));
        closeMember.addEventListener('click', () => memberModal.classList.remove("open"));
        memberModal.addEventListener('click', (e) => { if(e.target === memberModal) memberModal.classList.remove("open"); });
        const registerButton = document.getElementById("registerBtn");
        registerButton.addEventListener('click', () => {
            const nameInput = document.getElementById("memberName");
            const pwd = document.getElementById("memberPwd");
            if(nameInput.value.trim() === "") { showToast("代号不能为空", true); return; }
            currentUser = { name: nameInput.value.trim() };
            saveUser();
            memberModal.classList.remove("open");
            showToast(`欢迎上船，${escapeHtml(currentUser.name)}！`);
            renderPosts();
        });
        // 关闭帖子模态框
        const postModal = document.getElementById("postDetailModal");
        const closePost = document.getElementById("closePostModal");
        closePost.addEventListener('click', () => postModal.classList.remove("open"));
        postModal.addEventListener('click', (e) => { if(e.target === postModal) postModal.classList.remove("open"); });
    }

    init();
</script>
</body>
</html>
